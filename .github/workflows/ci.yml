name: SpaceGL CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# NOTE: the dependency list below is repeated per job on purpose
# (GitHub Actions job-level env is not shared across jobs, and a folded
# scalar in an exported env var is a footgun for word splitting).
# mesa-vulkan-drivers provides the lavapipe (lvp) Vulkan ICD, which is
# what makes gdd_mesh / gdd_bench / the golden render actually RUN on
# the runner instead of skipping with exit 77.

jobs:
  # ====================================================================
  # Full build + test matrix: gcc/clang x Release/Debug. Debug builds
  # carry ASan+UBSan on every target (the server boundary tests are
  # always instrumented, in both build types).
  # ====================================================================
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ clang libomp-dev pkgconf \
            libglfw3-dev libglew-dev libglu1-mesa-dev \
            libssl-dev libncurses-dev \
            libvulkan-dev vulkan-tools vulkan-validationlayers \
            mesa-vulkan-drivers glslc spirv-tools \
            cppcheck rpm rpmlint \
            python3 python3-pil

      - name: Verify no build artifacts in source tree
        run: |
          # Fail if any build directory is tracked by git
          if git ls-files | grep -qE '^build(-.*)?/'; then
            echo "ERROR: build artifacts are tracked in git:"
            git ls-files | grep -E '^build(-.*)?/'
            exit 1
          fi
          echo "OK: no build artifacts in git"

      - name: Configure CMake
        run: |
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            # ASan+UBSan on every TU (for a C project CMake passes
            # CMAKE_C_FLAGS through to the compiler driver at link time).
            cmake -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run test suite (ctest)
        working-directory: build
        run: ctest --output-on-failure

      - name: Run CppCheck
        run: |
          cppcheck -I include --enable=warning,portability,performance \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=unknownMacro \
            --suppress=intToPointerCast \
            --inline-suppr \
            --error-exitcode=1 src/ tests/

      - name: Run rpmlint
        run: |
          cat << 'EOF' > ~/.rpmmacros
          %autorelease 1%{?dist}
          %autochangelog %(cat changelog 2>/dev/null || echo "* Tue Oct 13 2026 Nicola Taibi <nicola.taibi.1967@gmail.com> - %{version}-%{release}\n- Package build")
          EOF
          rpmlint spacegl.spec

  # ====================================================================
  # Smoke: the REAL binaries with REAL flags. No dummy --headless
  # switches: the server is started with its actual --data-dir flag,
  # the client is the actual command deck driven through stdin exactly
  # like a human (IP, name, access code, faction, class), and the
  # assertions check what the two endpoints really print on the wire.
  # ====================================================================
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ clang libomp-dev pkgconf \
            libglfw3-dev libglew-dev libglu1-mesa-dev \
            libssl-dev libncurses-dev \
            libvulkan-dev vulkan-tools vulkan-validationlayers \
            mesa-vulkan-drivers glslc spirv-tools

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Version flags (real binaries, real --version)
        run: |
          ./build/spacegl_server --version
          ./build/spacegl_client --version

      - name: End-to-end smoke on 127.0.0.1:5000
        run: |
          set -euo pipefail
          export SPACEGL_KEY="ci-smoke-shared-master-key-000000"
          DATA="$(mktemp -d)"
          ./build/spacegl_server --data-dir "$DATA" >server.log 2>&1 &
          SERVER_PID=$!
          # Wait for the real TCP listener (port 5000 = DEFAULT_PORT).
          for _ in $(seq 1 75); do
            if (exec 3<>/dev/tcp/127.0.0.1/5000) 2>/dev/null; then break; fi
            sleep 0.2
          done
          (exec 3<>/dev/tcp/127.0.0.1/5000) 2>/dev/null || {
            echo "FAIL: server port 5000 never opened"; cat server.log; exit 1; }
          # The real client (command deck), fresh recruit: the five
          # interactive answers piped in the exact prompted order.
          # No DISPLAY on the runner: the deck survives the visualizer
          # failure in CLI-only mode (the assertions below cover that
          # path plus the handshake/login/sync round-trip).
          printf '127.0.0.1\nCI_SMOKE\ns3cr3t-access-code\n0\n0\n' | \
            timeout 25 ./build/spacegl_client >client.log 2>&1 || true
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo "--- server.log (tail) ---"; tail -n 20 server.log
          echo "--- client.log (tail) ---"; tail -n 20 client.log
          grep -q "listening on port 5000" server.log
          grep -q "Galaxy Map synchronized" client.log
          grep -q "Welcome aboard, new Captain" client.log
          grep -q "Command Deck ready" client.log
          # The login must have persisted the captain in the data dir.
          test -d "$DATA/captains/CI_SMOKE"

      - name: Long-running stability (60 s server RSS leak check)
        run: |
          # The REAL server + REAL client (fresh recruit, then one "pos"
          # every 2 s) for 60 s; the server RSS must not grow by more
          # than 10 MB (a ~170 B/tick leak, i.e. ~36 MB/h, would fail).
          # The matrix jobs also run it via ctest; this explicit step is
          # the smoke job's long-haul pass (Prompt 6C).
          bash tests/stability_test.sh 60 \
            build/spacegl_server build/spacegl_client

  # ====================================================================
  # Fuzz: the REAL libFuzzer harness (tests/fuzz_packets.c) driving
  # dispatch_packet() + the command parser over a socketpair, seeded
  # from tests/fuzz/corpus. clang is the fuzzer compiler (libFuzzer is
  # a clang/LLVM feature); the same harness also runs as a plain corpus
  # regression (fuzz_corpus_test, ASan/UBSan) inside ctest on EVERY
  # matrix job, gcc included.
  # ====================================================================
  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ clang libomp-dev pkgconf \
            libglfw3-dev libglew-dev libglu1-mesa-dev \
            libssl-dev libncurses-dev \
            libvulkan-dev vulkan-tools vulkan-validationlayers \
            mesa-vulkan-drivers glslc spirv-tools

      - name: Configure (clang + libFuzzer)
        run: cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug

      - name: Build fuzz target
        run: cmake --build build-fuzz --target fuzz_packets -j"$(nproc)"

      - name: Run libFuzzer (3-minute budget, seeded corpus)
        run: |
          # libFuzzer exits 0 on a clean time budget and non-zero when
          # it finds a regression; the corpus dir is the seed corpus AND
          # the minimal unit dir (a new crash re-runs deterministically).
          # -timeout=25 limits any single iteration to avoid stalls,
          # -rss_limit_mb=2048 enforces memory limit without unknown flag warnings,
          # and timeout 300 provides a 2-minute buffer over max_total_time=180
          # to ensure libFuzzer shuts down cleanly without triggering exit code 124.
          timeout 300 ./build-fuzz/tests/fuzz_packets \
            tests/fuzz/corpus -max_total_time=180 -timeout=25 -rss_limit_mb=2048

  # ====================================================================
  # GPU: the GDD per-pass benchmark with the committed regression
  # threshold, and the golden render: screenshots of BOTH render paths
  # (CPU-driven and GPU-driven, one binary / SPACEGL_GPD switch)
  # compared with tests/golden_test.py against each other and against
  # the committed golden image. Runs on the lavapipe ICD; xvfb stands
  # in for a display (the viewer creates a real GLFW window).
  # ====================================================================
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ clang libomp-dev pkgconf \
            libglfw3-dev libglew-dev libglu1-mesa-dev \
            libssl-dev libncurses-dev \
            libvulkan-dev vulkan-tools vulkan-validationlayers \
            mesa-vulkan-drivers glslc spirv-tools \
            python3 python3-pil \
            xvfb

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: GDD benchmark (time per pass + regression threshold)
        run: |
          ./build/tests/gdd_mesh_test ./build/shaders \
            --benchmark 100 tests/gdd_bench_thresholds.txt

      - name: Golden render (CPU + GDD paths, deterministic flags)
        run: |
          set -euo pipefail
          # Fixed seed, no camera drift, fixed window: frame 30 of a
          # headless render must be reproducible (modulo MSAA noise).
          # The SHM name (first argument) does not name an existing
          # segment: the viewer creates it EMPTY, which is exactly the
          # scene both render paths must agree on (starfield + empty
          # tactical state, no session involved).
          xvfb-run -a env SPACEGL_GPD=0 ./build/spacegl_vulkan /sg_golden_shm \
            --window 640x480 --seed 1 --no-rotate \
            --screenshot /tmp/golden_cpu.ppm --screenshot-frame 30
          xvfb-run -a env SPACEGL_GPD=1 ./build/spacegl_vulkan /sg_golden_shm \
            --window 640x480 --seed 1 --no-rotate \
            --screenshot /tmp/golden_gdd.ppm --screenshot-frame 30
          # 1. The two paths of the SAME binary must render parity.
          #    REGION-BASED comparison (Prompt 6A): the old single global
          #    RMSE (25.0) let a localised artifact pass if it covered
          #    < ~10% of the pixels. Now: a global RMSE sanity check
          #    (30.0) plus per-region tolerances (center / top-left /
          #    top-right / bottom), the per-region cross-path floor being
          #    ~18 (the starfield is identical geometry/data but is
          #    rasterized with different primitives: CPU TWINKLE mesh vs
          #    GDD point sprite) and the tolerances sitting ~50% above
          #    that floor. A dead/desynced path still fails (a black
          #    region vs scene pushes the region RMSE far past its
          #    tolerance), and a full report (per-region RMSEs) is
          #    printed on every run.
          python3 tests/golden_test.py /tmp/golden_cpu.ppm /tmp/golden_gdd.ppm --mode parity
          # 2. The GDD path must match the committed golden image
          #    (same path vs same path: the real regression pin).
          #    Region tolerances: center 8.0 (galaxy map - the primary
          #    content: allows minor shader-compilation color shifts,
          #    catches a black sector or a missing object), HUD regions
          #    5.0 (text/numbers: a missing digit is > 5.0 RMSE).
          python3 tests/golden_test.py /tmp/golden_gdd.ppm tests/golden/golden_gdd.ppm --mode regression

      - name: Upload golden captures (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-captures
          path: |
            /tmp/golden_cpu.ppm
            /tmp/golden_gdd.ppm

  # ====================================================================
  # GPU (real driver): the same GDD benchmark, golden render and a 1-frame
  # GDD smoke on a SELF-HOSTED runner that carries a real GPU (NVIDIA/
  # AMD/Intel). lavapipe (the job above) covers the compute-pass LOGIC;
  # this job covers DRIVER-SPECIFIC behavior (a driver that optimizes a
  # compute pass differently, a rasterization difference, a memory-model
  # quirk) that software rasterization can never exercise.
  #
  # Activation: the job is gated on BOTH
  #   1. the repo variable GPU_RUNNER_ENABLED == "true" (set it in the
  #      repo settings once a self-hosted runner labeled "gpu" exists;
  #      without it the job is SKIPPED, not pending, on every push - a
  #      job waiting for a runner that will never show up would block
  #      the whole workflow)
  #   2. an lspci check at runtime: a runner carrying the label but no
  #      actual GPU passes with "No GPU detected, skipping".
  #
  # The thresholds are the SAME as the lavapipe job: a real GPU is
  # expected to be FASTER than the software rasterizer, so the committed
  # gdd_bench_thresholds.txt and the golden region tolerances (center
  # 8.0 / HUD 5.0 / global 30.0, Prompt 6A) remain safe upper bounds.
  # ====================================================================
  gpu_real:
    name: GPU (real driver)
    runs-on: [self-hosted, linux, gpu]
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request')
      && vars.GPU_RUNNER_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Check for GPU
        id: check_gpu
        run: |
          if lspci | grep -qiE 'vga|3d|display'; then
            echo "gpu=true" >> "$GITHUB_OUTPUT"
            lspci | grep -iE 'vga|3d|display'
          else
            echo "gpu=false" >> "$GITHUB_OUTPUT"
            echo "No GPU detected, skipping"
          fi

      - name: Skip marker (no GPU on this runner)
        if: steps.check_gpu.outputs.gpu != 'true'
        run: |
          echo "gpu_real: nothing to do (no GPU on the labeled runner)"

      - name: Install dependencies
        if: steps.check_gpu.outputs.gpu == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ clang libomp-dev pkgconf \
            libglfw3-dev libglew-dev libglu1-mesa-dev \
            libssl-dev libncurses-dev \
            libvulkan-dev vulkan-tools vulkan-validationlayers \
            mesa-vulkan-drivers glslc spirv-tools \
            python3 python3-pil \
            xvfb

      - name: Build (Release)
        if: steps.check_gpu.outputs.gpu == 'true'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: GDD benchmark on real GPU
        if: steps.check_gpu.outputs.gpu == 'true'
        run: |
          # Same compute passes, same committed threshold as the
          # lavapipe job (gdd_bench_thresholds.txt): the real driver
          # must be at least as fast as the software rasterizer.
          ./build/tests/gdd_mesh_test ./build/shaders \
            --benchmark 100 tests/gdd_bench_thresholds.txt
          echo "GDD benchmark passed on real GPU"

      - name: Golden render on real GPU (region-based, Prompt 6A)
        if: steps.check_gpu.outputs.gpu == 'true'
        run: |
          set -euo pipefail
          # Real GPU or xvfb (the viewer creates a real GLFW window).
          if [ -z "${DISPLAY:-}" ]; then
            RUNX="xvfb-run -a"
          else
            RUNX=""
          fi
          # Deterministic flags, same as the lavapipe job: frame 30 of
          # both render paths (one binary / SPACEGL_GPD switch) over an
          # empty SHM segment.
          $RUNX env SPACEGL_GPD=0 ./build/spacegl_vulkan /sg_golden_shm \
            --window 640x480 --seed 1 --no-rotate \
            --screenshot /tmp/golden_cpu.ppm --screenshot-frame 30
          $RUNX env SPACEGL_GPD=1 ./build/spacegl_vulkan /sg_golden_shm \
            --window 640x480 --seed 1 --no-rotate \
            --screenshot /tmp/golden_gdd.ppm --screenshot-frame 30
          # 1. Cross-path parity, region-based (per-region tolerances
          #    calibrated above the measured cross-path floor).
          python3 tests/golden_test.py /tmp/golden_cpu.ppm /tmp/golden_gdd.ppm --mode parity
          # 2. Same-path regression pin vs the committed golden image:
          #    this is where a driver that rasterizes a compute pass
          #    differently shows up (center 8.0 / HUD 5.0 / global 30).
          python3 tests/golden_test.py /tmp/golden_gdd.ppm tests/golden/golden_gdd.ppm --mode regression

      - name: GDD smoke (1 frame, screenshot not black/white)
        if: steps.check_gpu.outputs.gpu == 'true'
        run: |
          set -euo pipefail
          if [ -z "${DISPLAY:-}" ]; then
            RUNX="xvfb-run -a"
          else
            RUNX=""
          fi
          # Render ONE frame through the GPU-driven path and capture the
          # backbuffer: a basic "the GPU actually rendered something"
          # check (the image must be neither all-black nor all-white).
          timeout 30 $RUNX env SPACEGL_GPD=1 ./build/spacegl_vulkan /sg_smoke_shm \
            --window 640x480 --seed 1 --no-rotate \
            --screenshot /tmp/gdd_smoke.ppm --screenshot-frame 1
          if [ ! -s /tmp/gdd_smoke.ppm ]; then
            echo "FAIL: screenshot not created"
            exit 1
          fi
          python3 - <<'EOF'
          from PIL import Image
          import sys
          img = Image.open('/tmp/gdd_smoke.ppm').convert('RGB')
          px = list(img.getdata())
          mean = sum(sum(p) for p in px) / (len(px) * 3)
          if mean < 10:
              print(f'FAIL: image is nearly black (mean={mean:.1f})')
              sys.exit(1)
          if mean > 245:
              print(f'FAIL: image is nearly white (mean={mean:.1f})')
              sys.exit(1)
          print(f'OK: image mean pixel value = {mean:.1f}')
          EOF

      - name: Upload smoke capture (artifact)
        if: always() && steps.check_gpu.outputs.gpu == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-real-smoke
          path: /tmp/gdd_smoke.ppm
